```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CNC Supplies LLC</title>

  <style>
    :root {
      --navy: #172A3A;
      --steel: #3E6175;
      --orange: #F28C28;
      --light: #F2F4F5;
      --graphite: #202426;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--graphite);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      padding: 40px;
    }

    .card {
      min-height: 70vh;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px;
      position: relative;
      overflow: hidden;
    }

    /* Industrial accent */
    .card::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      right: -180px;
      bottom: -180px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mark {
      width: 18px;
      height: 18px;
      background: var(--orange);
    }

    .company {
      color: var(--white);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main {
      max-width: 760px;
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0 0 24px;
      color: var(--white);
      font-size: clamp(48px, 8vw, 96px);
      line-height: 0.95;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    h1 span {
      color: var(--orange);
    }

    .tagline {
      margin: 0;
      color: #D7E0E5;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.25;
      font-weight: 300;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 40px;
      color: var(--steel);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .line {
      width: 80px;
      height: 2px;
      background: var(--orange);
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      .card {
        min-height: 90vh;
        padding: 35px;
      }

      footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <header>
        <div class="mark"></div>
        <div class="company">CNC Supplies LLC</div>
      </header>

      <main>
        <h1>
          We make<br>
          things <span>possible.</span>
        </h1>

        <p class="tagline">
          Providing customers with connections.
        </p>
      </main>

      <footer>
        <div class="line"></div>
        <div>Manufacturing · Sourcing · Connections</div>
      </footer>

    </div>
  </div>

</body>
</html>
